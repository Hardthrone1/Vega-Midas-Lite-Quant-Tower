<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDAS Proxy Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1322;
      color: #e3f3ff;
      font-family: 'Courier New', monospace;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #38cfff; text-shadow: 0 0 10px rgba(56,207,255,.5); margin-bottom: 20px; }
    .section { background: #070d18; border: 1px solid #1c3454; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    .section h2 { color: #38cfff; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
    button {
      background: #38cfff; color: #0a1322; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-bottom: 10px;
    }
    button:hover { background: #8ae6ff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output {
      background: #000; border: 1px solid #38cfff; padding: 10px; margin-top: 10px;
      max-height: 300px; overflow-y: auto; font-size: 12px; color: #38cfff;
    }
    .success { color: #4ade80; }
    .error { color: #ff6b6b; }
    .warning { color: #fbbf24; }
    .status {
      display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;
      margin-bottom: 10px;
    }
    .status.ok { background: #4ade80; color: #000; }
    .status.error { background: #ff6b6b; color: #fff; }
    .status.pending { background: #fbbf24; color: #000; }
  </style>
</head>
<body>

<div class="container">
  <h1>🧪 MIDAS Proxy Test Suite</h1>

  <!-- Proxy Status -->
  <div class="section">
    <h2>Proxy Status</h2>
    <div id="proxyStatus" class="status pending">⏳ Checking...</div>
    <button onclick="testProxyStatus()">🔄 Check Proxy</button>
    <div id="proxyOutput" class="output"></div>
  </div>

  <!-- Models List -->
  <div class="section">
    <h2>Available Models</h2>
    <button onclick="testModelsList()">📋 Fetch Models List</button>
    <div id="modelsOutput" class="output"></div>
  </div>

  <!-- Simple Chat -->
  <div class="section">
    <h2>Test Chat Completion</h2>
    <input type="text" id="testPrompt" placeholder="Enter test prompt..."
           style="width: 100%; padding: 8px; border: 1px solid #1c3454; background: #070d18; color: #e3f3ff; margin-bottom: 10px;">
    <button onclick="testChatCompletion()">💬 Send Test Message</button>
    <div id="chatOutput" class="output"></div>
  </div>

  <!-- Diagnostics -->
  <div class="section">
    <h2>Diagnostics</h2>
    <button onclick="showDiagnostics()">🔍 Show Diagnostics</button>
    <div id="diagnosticsOutput" class="output"></div>
  </div>

</div>

<script>
  function log(elementId, message, type = 'info') {
    const el = document.getElementById(elementId);
    const time = new Date().toLocaleTimeString();
    const className = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
    el.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(elementId, text, status) {
    document.getElementById(elementId).className = `status ${status}`;
    document.getElementById(elementId).textContent = text;
  }

  async function testProxyStatus() {
    const el = 'proxyOutput';
    document.getElementById(el).innerHTML = '';
    setStatus('proxyStatus', '⏳ Testing...', 'pending');

    try {
      log(el, 'Pinging proxy at http://localhost:8001...', 'info');

      const response = await fetch('http://localhost:8001/api/v1/models', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if (response.ok) {
        log(el, '✓ Proxy is running!', 'success');
        log(el, `Response status: ${response.status}`, 'success');
        setStatus('proxyStatus', '✓ PROXY OK', 'ok');
      } else {
        log(el, `✗ Proxy returned status ${response.status}`, 'error');
        setStatus('proxyStatus', `✗ HTTP ${response.status}`, 'error');
      }
    } catch (err) {
      log(el, `✗ Cannot reach proxy: ${err.message}`, 'error');
      log(el, 'Make sure to run: node midas-proxy.js', 'warning');
      setStatus('proxyStatus', '✗ PROXY OFFLINE', 'error');
    }
  }

  async function testModelsList() {
    const el = 'modelsOutput';
    document.getElementById(el).innerHTML = '';
    log(el, 'Fetching models list...', 'info');

    try {
      const response = await fetch('http://localhost:8001/api/v1/models');
      const data = await response.json();

      log(el, `✓ Received ${data.data?.length || 0} models`, 'success');

      const models = data.data?.slice(0, 5) || [];
      models.forEach(m => {
        log(el, `  • ${m.id}`, 'success');
      });

      if (data.data?.length > 5) {
        log(el, `  ... and ${data.data.length - 5} more`, 'info');
      }
    } catch (err) {
      log(el, `✗ Error: ${err.message}`, 'error');
    }
  }

  async function testChatCompletion() {
    const el = 'chatOutput';
    const prompt = document.getElementById('testPrompt').value || 'Hello, are you working?';
    document.getElementById(el).innerHTML = '';

    log(el, `Sending prompt: "${prompt}"`, 'info');
    log(el, 'Model: qwen/qwen3.6-flash', 'info');

    try {
      const response = await fetch('http://localhost:8001/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'qwen/qwen3.6-flash',
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 100
        })
      });

      const data = await response.json();

      if (data.error) {
        log(el, `✗ API Error: ${data.error.message}`, 'error');
      } else if (data.choices?.[0]?.message?.content) {
        log(el, '✓ Response received:', 'success');
        log(el, data.choices[0].message.content, 'success');
      } else {
        log(el, `✗ Unexpected response format`, 'error');
        log(el, JSON.stringify(data, null, 2), 'warning');
      }
    } catch (err) {
      log(el, `✗ Error: ${err.message}`, 'error');
    }
  }

  function showDiagnostics() {
    const el = 'diagnosticsOutput';
    document.getElementById(el).innerHTML = '';

    log(el, `Browser: ${navigator.userAgent}`, 'info');
    log(el, `Time: ${new Date().toLocaleString()}`, 'info');
    log(el, `Dashboard URL: ${window.location.href}`, 'info');
    log(el, `Proxy URL: http://localhost:8001`, 'info');
    log(el, ``, 'info');
    log(el, 'MIDAS Status:', 'info');
    log(el, `window.midas: ${window.midas ? '✓ Loaded' : '✗ Not loaded'}`, window.midas ? 'success' : 'error');
    log(el, `MIDASIntegration: ${typeof MIDASIntegration !== 'undefined' ? '✓ Loaded' : '✗ Not loaded'}`, typeof MIDASIntegration !== 'undefined' ? 'success' : 'error');
  }

  // Auto-run tests on load
  window.addEventListener('load', () => {
    console.log('[TEST] Page loaded, running initial tests...');
    setTimeout(testProxyStatus, 500);
    setTimeout(showDiagnostics, 1000);
  });
</script>

</body>
</html>
